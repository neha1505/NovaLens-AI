services:
  - type: web
    name: novalens-backend
    env: python
    buildCommand: "pip install --upgrade pip setuptools wheel && pip install -r backend/requirements.txt"
    startCommand: "gunicorn -w 1 -k uvicorn.workers.UvicornWorker backend.main:app --bind 0.0.0.0:$PORT --timeout 120"
    envVars:
      - key: PYTHON_VERSION
        value: 3.10.12
      - key: LLM_PROVIDER
        value: gemini
      - key: GEMINI_API_KEY
        sync: false
